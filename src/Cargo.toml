[workspace]
exclude = ["./rapier/crates/rapier3d"]

[package]
name = "engine"
version = "0.1.0"
authors = ["Otto-Ville Lamminpää <ottoville.lamminpaa@gmail.com>"]
edition = "2021"

[lib]
crate-type = ["cdylib"]
path = "engine/src/lib.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[workspace.lints]


[dependencies]
externref = "0.2.0"
rapier3d = { path = "./rapier/crates/rapier3d" }
terramath = { path = "./terramath" }

[dev-dependencies]
wasm-bindgen-test = "0.3.43"

[profile.release]
opt-level = 3

[profile.dev]
debug = "limited"
debug-assertions = true

[profile.dev.package.parry3d]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false
codegen-units = 16

[profile.dev.package.terramath]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false
codegen-units = 16

[features]
webgpu = []
