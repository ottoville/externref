[package]
name = "engine"
version = "0.1.0"
authors = ["Otto-Ville Lamminpää <ottoville.lamminpaa@gmail.com>"]
edition = "2018"

[lib]
crate-type = ["cdylib"]
path = "engine/src/lib.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
#rapier3d = "0.11.1"
rapier3d = { path = "../../../rapier/crates/rapier3d" }

[profile.dev.package.parry3d]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false
codegen-units = 16
