[package]
name = "engine"
version = "0.1.0"
authors = ["Otto-Ville Lamminpää <ottoville.lamminpaa@gmail.com>"]
edition = "2021"

[lib]
crate-type = ["cdylib"]
path = "engine/src/lib.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
rapier3d = { git = "https://terraSim@dev.azure.com/terraSim/terrasim/_git/rapier", branch = "master" }

#[patch."https://terraSim@dev.azure.com/terraSim/terrasim/_git/rapier"]
#rapier3d = { path = "../../../rapier/crates/rapier3d" }


[profile.dev.package.parry3d]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false
codegen-units = 16

[features]
webgpu = []