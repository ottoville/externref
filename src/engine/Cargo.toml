[workspace]
exclude = ["../rapier/crates/rapier3d"]

[package]
name = "engine"
version = "0.1.0"
authors = ["Otto-Ville Lamminpää <ottoville.lamminpaa@gmail.com>"]
edition = "2021"

[lib]
crate-type = ["cdylib"]
path = "./src/lib.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[workspace.lints]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(rust_analyzer)'] }


[dependencies]
externref ={ path = "../externref/crates/lib" }
rapier3d = { path = "../rapier/crates/rapier3d" }
terramath = { path = "../terramath" }
collider = { path = "../collider" }
logger = { path = "../logger" }
webgpu = { path = "../webgpu" }
allocators = { path = "../allocators" }
IDB = { path = "../IDB" }
web = { path = "../web" }

[dev-dependencies]
wasm-bindgen-test = "0.3.58"

[profile.release]
opt-level = 3

[profile.dev]
debug = "limited"
debug-assertions = true

[profile.dev.package.parry3d]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false
codegen-units = 16

[profile.dev.package.terramath]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false
codegen-units = 16

[profile.dev.package.logger]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false
codegen-units = 16

[features]
webgpu = []
