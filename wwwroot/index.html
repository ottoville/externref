            window.initRouter = resolve;
        });
        window._modules = {};
        Object.defineProperty(window, 'Module', {
            get: function () {
                let stack = new Error().stack;
                if (stack.includes('glslang')) {
                    return window._modules['glslang'];
                }
                //console.log(new Error().stack);
                return window._modules['dotnet']
            },
            set: function (module) {
                let script = new Error().stack.split('\n').pop();
                if (script.includes('blazor') || script.includes('dotnet')) {
                    window._modules['dotnet'] = module;
                }
                if (script.includes('glslang')) {
                    window._modules['glslang'] = module;
                }
            }
        });
    </script>
