trigger:
  branches:
    include:
    - refs/heads/master
  paths:
    include:
    - /
  batch: True
name: $(date:yyyyMMdd)$(rev:.r)
stages:
- stage: deployBicepStage
  displayName: Deploy infrastructure
  jobs:
  - deployment: deployBicep
    displayName: Deploy bicep
    timeoutInMinutes: 0
    pool:
      vmImage: ubuntu-24.04
    environment: production
    strategy:
      runOnce:    #rolling, canary are the other strategies that are supported
        deploy:
          steps:
          - checkout: self
            submodules: false
          - task: AzureResourceManagerTemplateDeployment@3
            displayName: Create resources
            inputs:
              deploymentScope: 'Resource Group'
              azureResourceManagerConnection: $(service-connection)
              subscriptionId: $(subscription-id)
              action: 'Create Or Update Resource Group'
              resourceGroupName: 'terrasim-rg'
              location: 'West Europe'
              templateLocation: 'Linked artifact'
              csmFile: '$(Build.SourcesDirectory)/infrastructure/main.bicep'
              deploymentMode: 'Incremental'
          - task: AzureCLI@2 #This tasks needs Microsoft.Web/locations/operationResults/read permission in subscription level, which can be archieved by giving contributor role
            displayName: 'echo SourceBranchName'
            inputs:
              azureSubscription: $(service-connection)
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              arguments: $(Build.SourceBranchName)
              inlineScript: "echo \"hello world:$*\""
              addSpnToEnvironment: true

          - task: AzureCLI@2 #This tasks needs Microsoft.Web/locations/operationResults/read permission in subscription level, which can be archieved by giving contributor role
            displayName: 'echo SourceVersionMessage'
            inputs:
              azureSubscription: $(service-connection)
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              arguments: $(Build.SourceVersionMessage)
              inlineScript: "echo \"hello world:$*\""
              addSpnToEnvironment: true
          - task: AzureCLI@2 #This tasks needs Microsoft.Web/locations/operationResults/read permission in subscription level, which can be archieved by giving contributor role
            displayName: 'Delete PR environment'
            inputs:
              azureSubscription: $(service-connection)
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              arguments: $(Build.SourceVersionMessage)
              inlineScript: "az staticwebapp environment delete -n TerraSim --resource-group terrasim-rg --environment-name $(echo \"$*\" | head -n 1 | cut -d':' -f1 | cut -d' ' -f3) --yes"
              addSpnToEnvironment: true
- stage: BuildSwa
  displayName: Build SWA
  variables:
    npm_config_cache: $(Pipeline.Workspace)/.npm
  jobs:
  - job: build_swa
    displayName: Build SWA
    timeoutInMinutes: 0
    pool:
      vmImage: ubuntu-24.04
    steps:
    - checkout: self
      submodules: true
    - task: Npm@1
      displayName: npm audit
      inputs:
        command: custom
        verbose: false
        customCommand: audit --omit dev
    - task: Cache@2
      displayName: Restore npm cache
      inputs:
        key: 'npm | "$(Agent.OS)" | ./package-lock.json'
        restoreKeys: |
          npm | "$(Agent.OS)"
        path: $(npm_config_cache)
    - task: Npm@1
      displayName: npm install
      inputs:
        command: custom
        verbose: false
        customCommand: ci --omit dev
    - task: Cache@2
      displayName: Restore rust cache
      inputs:
        key: 'rust'
        path: './src/engine/target'
    - task: Cache@2
      displayName: Restore rust buildscript cache
      inputs:
        key: 'rustbuildscript'
        path: './buildscript/target'
    - task: Rustup@1
      displayName: Add wasm32-unknown-unknown target
      inputs:
        rustupCommand: target add wasm32-unknown-unknown
    - task: Npm@1
      displayName: npm build
      inputs:
        command: custom
        verbose: false
        customCommand: run build-prod
    - task: Bash@3
      displayName: 'Build rust'
      inputs:
        targetType: 'inline'
        script: |
          cargo rustc --features webgpu --release --lib --manifest-path ./src/engine/Cargo.toml --target wasm32-unknown-unknown -- -C target-feature=+simd128,+atomics,+bulk-memory,+mutable-globals && cd ./buildscript && cargo run --release
    - task: Npm@1
      displayName: npm build rollup
      inputs:
        command: custom
        workingDir: src
        verbose: false
        customCommand: run build-rollup-prod
    - task: CopyFiles@2
      inputs:
        SourceFolder: './wwwroot'
        Contents: '**'
        TargetFolder: '$(Build.ArtifactStagingDirectory)'
    - task: PublishPipelineArtifact@1
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)'
        artifact: 'build'
        publishLocation: 'pipeline'
  - job: test
    displayName: Run tests
    timeoutInMinutes: 0
    pool:
      vmImage: ubuntu-24.04
    steps:
    - template: azure-test.yml

- stage: deployEnv
  dependsOn: BuildSwa
  displayName: Deploy env
  jobs:
  - deployment: deploySwa
    displayName: Deploy SWA
    environment: production
    variables:
    - group: swa
    timeoutInMinutes: 0
    pool:
      vmImage: ubuntu-24.04
    strategy:
      runOnce:    #rolling, canary are the other strategies that are supported
        deploy:
          steps:
          - checkout: none
          - task: DownloadPipelineArtifact@2
            inputs:
              buildType: 'current'
              artifactName: 'build'
              targetPath: '$(Build.BinariesDirectory)'
          - task: AzureStaticWebApp@0
            displayName: 'Static Web App: '
            inputs:
              workingDirectory: '/'
              app_location: $(Build.BinariesDirectory)
              skip_app_build: true
              verbose: false
              azure_static_web_apps_api_token: $(swakey)
              production_branch: master
