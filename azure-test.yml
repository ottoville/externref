steps:
- checkout: self
  submodules: true
- task: Cache@2
  displayName: Restore rust cache
  inputs:
    key: 'rust-test'
    path: './src/engine/target'
- task: Cache@2
  displayName: Restore cargo registry
  inputs:
    key: 'cargoregistry'
    path: /home/vsts/.cargo/registry
- task: PowerShell@2
  displayName: Rust unit test
  inputs:
    targetType: 'inline'
    script: 'cargo test --lib --workspace'
    workingDirectory: './src/engine'
    pwsh: true
- task: PowerShell@2
  displayName: Install wasm-bindgen-cli
  inputs:
    targetType: 'inline'
    script: 'cargo install wasm-bindgen-cli'
    pwsh: true
- task: PowerShell@2
  displayName: Add wasm32-unknown-unknown target
  inputs:
    targetType: 'inline'
    script: 'rustup target add wasm32-unknown-unknown'
    pwsh: true
- task: Cache@2
  displayName: Restore rust terramath cache
  inputs:
    key: 'rustterramath'
    path: './src/terramath/target'
- task: Cache@2
  displayName: Restore collider terramath cache
  inputs:
    key: 'ruscollider'
    path: './src/collider/target'

- task: PowerShell@2
  displayName: Math library unit test
  inputs:
    targetType: 'inline'
    script: 'cargo test --target wasm32-unknown-unknown'
    pwsh: true
    workingDirectory: './src/terramath'
- task: PowerShell@2
  displayName: Collider library unit test
  inputs:
    targetType: 'inline'
    script: 'cargo test --target wasm32-unknown-unknown'
    pwsh: true
    workingDirectory: './src/collider'
- task: PowerShell@2
  displayName: webgpu library unit test
  inputs:
    targetType: 'inline'
    script: 'cargo test'
    pwsh: true
    workingDirectory: './src/webgpu'
- task: PowerShell@2
  displayName: allocators library unit test
  inputs:
    targetType: 'inline'
    script: 'cargo test'
    pwsh: true
    workingDirectory: './src/allocators'