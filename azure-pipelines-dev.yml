pr:
  branches:
    include:
    - refs/heads/*
  paths:
    include:
    - /
name: $(date:yyyyMMdd)$(rev:.r)
stages:
- stage: deployBicepStage
  displayName: Deploy infrastructure
  jobs:
  - deployment: deployBicep
    displayName: Deploy bicep
    timeoutInMinutes: 0
    pool:
      vmImage: ubuntu-22.04
    environment: PR
    strategy:
      runOnce:    #rolling, canary are the other strategies that are supported
        deploy:
          steps:
          - checkout: self
            submodules: false
          - task: AzureResourceManagerTemplateDeployment@3
            inputs:
              deploymentScope: 'Resource Group'
              azureResourceManagerConnection: $(service-connection)
              subscriptionId: $(subscription-id)
              action: 'Create Or Update Resource Group'
              resourceGroupName: 'terrasim-rg'
              location: 'West Europe'
              templateLocation: 'Linked artifact'
              csmFile: '$(Build.SourcesDirectory)/infrastructure/main.bicep'
              deploymentMode: 'Incremental'
- stage: buildPrEnv
  displayName: Build PR env
  variables:
    npm_config_cache: $(Pipeline.Workspace)/.npm
  jobs:
  - job: build_swa
    displayName: Build SWA
    timeoutInMinutes: 0
    pool:
      vmImage: ubuntu-22.04
    steps:
    - checkout: self
      submodules: true
    - task: Npm@1
      displayName: npm audit
      inputs:
        command: custom
        workingDir: src
        verbose: false
        customCommand: audit --omit dev
    - task: Cache@2
      displayName: Restore npm cache
      inputs:
        key: 'npm | "$(Agent.OS)" | ./src/package-lock.json'
        restoreKeys: |
          npm | "$(Agent.OS)"
        path: $(npm_config_cache)
    - task: Npm@1
      displayName: npm install
      inputs:
        command: custom
        workingDir: src
        verbose: false
        customCommand: ci
    - task: Npm@1
      displayName: eslint
      inputs:
        command: custom
        workingDir: src
        verbose: false
        customCommand: run eslint
    - task: Cache@2
      displayName: Restore rust cache
      inputs:
        key: 'rust'
        path: './src/engine/target'
    - task: Cache@2
      displayName: Restore rust buildscript cache
      inputs:
        key: 'rustbuildscript'
        path: './buildscript/target'
    - task: Rustup@1
      displayName: Rustup
      inputs:
        rustupCommand: target add wasm32-unknown-unknown
    - task: Npm@1
      displayName: npm build
      inputs:
        command: custom
        workingDir: src
        verbose: false
        customCommand: run build
    - task: Npm@1
      displayName: Test rust
      inputs:
        command: custom
        workingDir: src
        verbose: false
        customCommand: run test-rust
    - task: CopyFiles@2
      inputs:
        SourceFolder: './wwwroot'
        Contents: '**'
        TargetFolder: '$(Build.ArtifactStagingDirectory)'
    - task: PublishPipelineArtifact@1
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)'
        artifact: 'build'
        publishLocation: 'pipeline'
- stage: deploySwaEnv
  dependsOn: buildPrEnv
  displayName: Deploy SWA env
  variables:
  - group: swa
  jobs:
  - deployment: deploySwa
    displayName: Deploy SWA
    environment: PR
    timeoutInMinutes: 0
    pool:
      vmImage: ubuntu-22.04
    strategy:
      runOnce:    #rolling, canary are the other strategies that are supported
        deploy:
          steps:
          - checkout: none
          - task: DownloadPipelineArtifact@2
            inputs:
              buildType: 'current'
              artifactName: 'build'
              targetPath: '$(Build.BinariesDirectory)'
          - task: AzureStaticWebApp@0
            displayName: 'Static Web App: '
            inputs:
              workingDirectory: '/'
              app_location: $(Build.BinariesDirectory)
              skip_app_build: true
              verbose: false
              azure_static_web_apps_api_token: $(swakey)
              deployment_environment: $(system.pullRequest.pullRequestId)
